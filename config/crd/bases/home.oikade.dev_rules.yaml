---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: rules.home.oikade.dev
spec:
  group: home.oikade.dev
  names:
    kind: Rule
    listKind: RuleList
    plural: rules
    singular: rule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.active
      name: Active
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastTriggered
      name: Last Triggered
      type: date
    - jsonPath: .status.nextFire
      name: Next Fire
      type: date
    - jsonPath: .status.today.targetMinutes
      name: Budget
      priority: 1
      type: integer
    - jsonPath: .status.today.runMinutes
      name: Run
      priority: 1
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Rule is run by the Oikade runtime. A moment runs its actions when a trigger fires and the
          condition holds; a hold keeps a capability at a value while its while is true.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Rule
            properties:
              condition:
                description: |-
                  condition is a CEL expression that must evaluate to true for the actions to run.
                  Variables: devices (map of device name to map of capability to value),
                  trigger (type, which is change, at or sun, and for a change device, capability, value and
                  previous), now (timestamp) and tz (the runtime's timezone). Timestamp accessors default
                  to UTC, so pass tz for local time.
                  For example: trigger.value && (now.getHours(tz) >= 18 || now.getHours(tz) < 7)
                maxLength: 4096
                type: string
              do:
                description: do are the actions, run in order.
                items:
                  description: Action is one step of a Rule. Exactly one field must
                    be set.
                  properties:
                    delay:
                      description: delay waits before the next action, e.g. 5m.
                      type: string
                    release:
                      description: 'release ends another Rule''s latched hold, or
                        its until: Released claims.'
                      properties:
                        rule:
                          description: rule names a Rule in the same namespace.
                          minLength: 1
                          type: string
                      required:
                      - rule
                      type: object
                    set:
                      description: set sets a capability on a device.
                      properties:
                        capability:
                          description: capability is the writable capability to set,
                            e.g. light.level.
                          minLength: 1
                          type: string
                        device:
                          description: device names a Device in the same namespace.
                          minLength: 1
                          type: string
                        for:
                          description: |-
                            for ends the claim after this long. A set on an arbitrated capability is a claim and must
                            end, with for, until or both; on any other capability it's a plain write, and for and until
                            have no effect.
                          type: string
                        priority:
                          description: priority is the claim's level. Defaults to
                            Normal.
                          enum:
                          - Safety
                          - Override
                          - Normal
                          type: string
                        room:
                          description: |-
                            room names a Room in the same namespace. Every discovered Device in it that reports the capability is set,
                            in name order.
                          minLength: 1
                          type: string
                        until:
                          description: |-
                            until ends the claim when the result without it next changes (Next), or at a release
                            action (Released). With for as well, Next ends the claim at whichever comes first.
                          enum:
                          - Next
                          - Released
                          type: string
                        value:
                          description: value is a bool or number matching the capability's
                            kind.
                          x-kubernetes-preserve-unknown-fields: true
                      required:
                      - capability
                      - value
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of device or room must be specified
                        rule: has(self.device) != has(self.room)
                      - message: for must be positive
                        rule: '!has(self.for) || duration(self.for) > duration(''0s'')'
                      - message: 'for can''t be combined with until: Released'
                        rule: '!has(self.for) || !has(self.until) || self.until !=
                          ''Released'''
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of set, delay or release must be specified
                    rule: '[has(self.set), has(self.delay), has(self.release)].exists_one(x,
                      x)'
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              hold:
                description: hold is the capability the Rule keeps at a value while
                  it's active.
                properties:
                  capability:
                    description: capability is the writable capability to hold, e.g.
                      switch.on.
                    minLength: 1
                    type: string
                  device:
                    description: device names a Device in the same namespace.
                    minLength: 1
                    type: string
                  room:
                    description: |-
                      room names a Room in the same namespace. Every discovered Device in it that reports the
                      capability is held.
                    minLength: 1
                    type: string
                  value:
                    description: value is a bool or number matching the capability's
                      kind.
                    x-kubernetes-preserve-unknown-fields: true
                required:
                - capability
                - value
                type: object
                x-kubernetes-validations:
                - message: exactly one of device or room must be specified
                  rule: has(self.device) != has(self.room)
              mode:
                default: Single
                description: mode decides what happens when a trigger fires while
                  a run is in progress.
                enum:
                - Single
                - Restart
                type: string
              priority:
                description: priority is the level of the hold's claim on an arbitrated
                  capability. Defaults to Normal.
                enum:
                - Safety
                - Override
                - Normal
                type: string
              startingDeadline:
                description: |-
                  startingDeadline is how late an at or sun trigger may still fire after the runtime was
                  down at its time. A later one is skipped and counted as missed. Unset skips every missed
                  time.
                type: string
              triggers:
                description: triggers are the moments that start the Rule.
                items:
                  description: Trigger is a moment that fires the Rule. Exactly one
                    field must be set.
                  properties:
                    at:
                      description: at fires at a local time of day.
                      properties:
                        days:
                          description: |-
                            days limits the trigger to these days. A day is the calendar day the trigger fires on, so
                            00:30 on Friday and Saturday nights is days [Sat, Sun]. Empty means every day.
                          items:
                            description: Weekday is a day of the week.
                            enum:
                            - Mon
                            - Tue
                            - Wed
                            - Thu
                            - Fri
                            - Sat
                            - Sun
                            type: string
                          maxItems: 7
                          type: array
                          x-kubernetes-list-type: set
                        time:
                          description: |-
                            time is the local time, HH:MM. A time skipped by a daylight saving change fires when the
                            clocks go forward, and a time that happens twice fires the first time.
                          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                      required:
                      - time
                      type: object
                    change:
                      description: change fires when a capability changes value.
                      properties:
                        capability:
                          description: capability is the canonical capability to watch,
                            e.g. sensor.occupancy-detected.
                          minLength: 1
                          type: string
                        device:
                          description: device names a Device in the same namespace.
                          minLength: 1
                          type: string
                        room:
                          description: |-
                            room names a Room in the same namespace. The trigger matches a change from any Device whose
                            roomRef is this room at the time of the change.
                          minLength: 1
                          type: string
                      required:
                      - capability
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of device or room must be specified
                        rule: has(self.device) != has(self.room)
                    sun:
                      description: sun fires at sunrise or sunset, from the runtime's
                        --latitude and --longitude.
                      properties:
                        days:
                          description: |-
                            days limits the trigger to these days. A day is the calendar day the trigger fires on.
                            Empty means every day.
                          items:
                            description: Weekday is a day of the week.
                            enum:
                            - Mon
                            - Tue
                            - Wed
                            - Thu
                            - Fri
                            - Sat
                            - Sun
                            type: string
                          maxItems: 7
                          type: array
                          x-kubernetes-list-type: set
                        event:
                          description: event is Sunrise or Sunset.
                          enum:
                          - Sunrise
                          - Sunset
                          type: string
                        offset:
                          description: offset moves the trigger from the event, e.g.
                            -15m for 15 minutes before.
                          type: string
                      required:
                      - event
                      type: object
                      x-kubernetes-validations:
                      - message: offset must be between -6h and 6h
                        rule: '!has(self.offset) || (duration(self.offset) >= duration(''-6h'')
                          && duration(self.offset) <= duration(''6h''))'
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of change, at or sun must be specified
                    rule: '[has(self.change), has(self.at), has(self.sun)].exists_one(x,
                      x)'
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              while:
                description: 'while is when the hold is active: a window, a when expression,
                  or both, or a budget.'
                properties:
                  budget:
                    description: |-
                      budget makes the hold active for a number of minutes a day, in planned slots. It holds one
                      Device's bool capability on, and that capability needs a control entry.
                    properties:
                      forbid:
                        description: forbid keeps the budget out of windows.
                        items:
                          description: BudgetForbid keeps the budget out of a window.
                          properties:
                            window:
                              description: window is the span of local time, "HH:MM"
                                to "HH:MM".
                              properties:
                                days:
                                  description: days limits the window to those starting
                                    on these days. Empty means every day.
                                  items:
                                    description: Weekday is a day of the week.
                                    enum:
                                    - Mon
                                    - Tue
                                    - Wed
                                    - Thu
                                    - Fri
                                    - Sat
                                    - Sun
                                    type: string
                                  maxItems: 7
                                  type: array
                                  x-kubernetes-list-type: set
                                end:
                                  description: end is "HH:MM", or {sun, offset}. An
                                    end at or before the start is the next day.
                                  x-kubernetes-preserve-unknown-fields: true
                                start:
                                  description: start is "HH:MM", or {sun, offset}.
                                  x-kubernetes-preserve-unknown-fields: true
                              required:
                              - end
                              - start
                              type: object
                          required:
                          - window
                          type: object
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                      minutes:
                        description: minutes is the day's budget.
                        properties:
                          bands:
                            description: bands picks the minutes from an input's value.
                            properties:
                              input:
                                description: input is the capability read at planningTime.
                                properties:
                                  capability:
                                    description: capability is a number capability,
                                      e.g. sensor.temperature.
                                    minLength: 1
                                    type: string
                                  device:
                                    description: device names a Device in the same
                                      namespace.
                                    minLength: 1
                                    type: string
                                  maxAge:
                                    default: 30m
                                    description: maxAge is how old the value may be.
                                      An older value counts as missing.
                                    type: string
                                required:
                                - capability
                                - device
                                type: object
                              missingMinutes:
                                description: missingMinutes is the budget when the
                                  input hasn't reported, or is older than maxAge.
                                format: int32
                                maximum: 1440
                                minimum: 0
                                type: integer
                              ranges:
                                description: ranges ascend by below, and the first
                                  that the value is below wins.
                                items:
                                  description: MinutesBand gives the budget for input
                                    values below a threshold.
                                  properties:
                                    below:
                                      anyOf:
                                      - type: integer
                                      - type: string
                                      description: |-
                                        below is the band's upper bound, e.g. "12" or "-0.5". Only the last band omits it, and it
                                        takes every value the others don't.
                                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                      x-kubernetes-int-or-string: true
                                    minutes:
                                      description: minutes is the day's budget for
                                        values in the band.
                                      format: int32
                                      maximum: 1440
                                      minimum: 0
                                      type: integer
                                  required:
                                  - minutes
                                  type: object
                                maxItems: 16
                                minItems: 1
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - input
                            - missingMinutes
                            - ranges
                            type: object
                          expression:
                            description: expression is CEL over devices, now and tz,
                              returning the minutes. A fraction is rounded.
                            maxLength: 4096
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of bands or expression must be specified
                          rule: has(self.bands) != has(self.expression)
                      planningTime:
                        default: "00:00"
                        description: 'planningTime starts each planning day: local
                          time, HH:MM.'
                        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                        type: string
                      prefer:
                        description: prefer weights windows for the budget. Scores
                          of overlapping windows add up.
                        items:
                          description: BudgetPrefer weights the slots in a window.
                          properties:
                            score:
                              description: score is added to each slot the window
                                touches. Negative avoids them.
                              format: int32
                              maximum: 100
                              minimum: -100
                              type: integer
                            window:
                              description: window is the span of local time, "HH:MM"
                                to "HH:MM".
                              properties:
                                days:
                                  description: days limits the window to those starting
                                    on these days. Empty means every day.
                                  items:
                                    description: Weekday is a day of the week.
                                    enum:
                                    - Mon
                                    - Tue
                                    - Wed
                                    - Thu
                                    - Fri
                                    - Sat
                                    - Sun
                                    type: string
                                  maxItems: 7
                                  type: array
                                  x-kubernetes-list-type: set
                                end:
                                  description: end is "HH:MM", or {sun, offset}. An
                                    end at or before the start is the next day.
                                  x-kubernetes-preserve-unknown-fields: true
                                start:
                                  description: start is "HH:MM", or {sun, offset}.
                                  x-kubernetes-preserve-unknown-fields: true
                              required:
                              - end
                              - start
                              type: object
                          required:
                          - score
                          - window
                          type: object
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                      slotMinutes:
                        default: 30
                        description: slotMinutes is the length of the slots the day
                          is planned in.
                        enum:
                        - 15
                        - 30
                        - 60
                        format: int32
                        type: integer
                    required:
                    - minutes
                    type: object
                  latch:
                    description: latch keeps the hold active once when has been true,
                      until a release action.
                    type: boolean
                  offDelay:
                    description: offDelay is how long the hold stays active after
                      the rest stops being true.
                    type: string
                  onDelay:
                    description: onDelay is how long the rest must stay true before
                      the hold starts.
                    type: string
                  when:
                    description: |-
                      when is a CEL expression over devices, now and tz, as in a Rule's condition.
                      For example: devices["bathroom-sensor"]["sensor.relative-humidity"] > 70
                    maxLength: 4096
                    type: string
                  window:
                    description: window is a span of local time each day.
                    properties:
                      days:
                        description: days limits the window to those starting on these
                          days. Empty means every day.
                        items:
                          description: Weekday is a day of the week.
                          enum:
                          - Mon
                          - Tue
                          - Wed
                          - Thu
                          - Fri
                          - Sat
                          - Sun
                          type: string
                        maxItems: 7
                        type: array
                        x-kubernetes-list-type: set
                      end:
                        description: end is "HH:MM", or {sun, offset}. An end at or
                          before the start is the next day.
                        x-kubernetes-preserve-unknown-fields: true
                      start:
                        description: start is "HH:MM", or {sun, offset}.
                        x-kubernetes-preserve-unknown-fields: true
                    required:
                    - end
                    - start
                    type: object
                type: object
                x-kubernetes-validations:
                - message: while needs a window, when or budget
                  rule: has(self.window) || has(self.when) || has(self.budget)
                - message: budget must be the only field of while
                  rule: '!has(self.budget) || !(has(self.window) || has(self.when)
                    || has(self.onDelay) || has(self.offDelay) || (has(self.latch)
                    && self.latch))'
                - message: latch needs when
                  rule: '!has(self.latch) || !self.latch || has(self.when)'
                - message: onDelay must not be negative
                  rule: '!has(self.onDelay) || duration(self.onDelay) >= duration(''0s'')'
                - message: offDelay must not be negative
                  rule: '!has(self.offDelay) || duration(self.offDelay) >= duration(''0s'')'
            type: object
            x-kubernetes-validations:
            - message: exactly one of triggers or while must be specified
              rule: has(self.triggers) != has(self.while)
            - message: do is required with triggers, and only with triggers
              rule: has(self.triggers) == has(self.do)
            - message: hold is required with while, and only with while
              rule: has(self.while) == has(self.hold)
            - message: priority applies to a hold; a set action takes its own
              rule: '!has(self.priority) || has(self.while)'
            - message: condition applies to triggers; a hold uses while.when
              rule: '!has(self.condition) || has(self.triggers)'
            - message: startingDeadline applies to triggers
              rule: '!has(self.startingDeadline) || has(self.triggers)'
            - message: a budget holds a device, not a room
              rule: '!has(self.while) || !has(self.while.budget) || (has(self.hold)
                && has(self.hold.device))'
          status:
            description: status defines the observed state of Rule
            properties:
              active:
                description: active is true while a hold is active.
                type: boolean
              conditions:
                description: 'conditions: Ready, set by the operator, and Scheduled,
                  set by the runtime.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastFire:
                description: |-
                  lastFire is the scheduled time of the last at or sun trigger the runtime fired or skipped,
                  so a restart doesn't fire it again.
                format: date-time
                type: string
              lastTriggered:
                description: lastTriggered is when the actions last started (updated
                  at most every minute).
                format: date-time
                type: string
              nextChange:
                description: nextChange is when a hold next starts or ends, if that's
                  known from the clock.
                format: date-time
                type: string
              nextFire:
                description: nextFire is when the next at or sun trigger fires.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the generation the Ready condition
                  was computed for.
                format: int64
                type: integer
              skipped:
                description: |-
                  skipped lists the Room members a set or hold left out, because the capability is
                  arbitrated on them and the set has no end.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              today:
                description: |-
                  today is a budget hold's plan for the current planning day, and its progress. The runtime
                  writes it, and reads it back after a restart the same day rather than planning again.
                properties:
                  blocks:
                    description: blocks are the planned runs.
                    items:
                      description: BudgetBlock is a planned run, from start to end.
                      properties:
                        end:
                          format: date-time
                          type: string
                        start:
                          format: date-time
                          type: string
                      required:
                      - end
                      - start
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  date:
                    description: date is the planning day, YYYY-MM-DD, local time.
                    type: string
                  runMinutes:
                    description: |-
                      runMinutes is how long the target has been on and available today, updated at most every
                      5 minutes.
                    format: int32
                    type: integer
                  scheduledMinutes:
                    description: scheduledMinutes is how much of it the plan places.
                    format: int32
                    type: integer
                  shortfallMinutes:
                    description: |-
                      shortfallMinutes is how much of it doesn't fit, within the forbid windows and the control
                      entry's limits.
                    format: int32
                    type: integer
                  starts:
                    description: starts counts the planned runs the hold has started
                      today.
                    format: int32
                    type: integer
                  targetMinutes:
                    description: targetMinutes is the day's budget, rounded up to
                      whole slots.
                    format: int32
                    type: integer
                  targetSource:
                    description: |-
                      targetSource is where the day's minutes came from: Bands, Missing (the bands input hadn't
                      reported, or was too old), Expression or None.
                    type: string
                required:
                - date
                - runMinutes
                - scheduledMinutes
                - shortfallMinutes
                - starts
                - targetMinutes
                - targetSource
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
