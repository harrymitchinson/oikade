---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: schedules.home.oikade.dev
spec:
  group: home.oikade.dev
  names:
    kind: Schedule
    listKind: ScheduleList
    plural: schedules
    singular: schedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.device
      name: Target
      type: string
    - jsonPath: .status.today.targetMinutes
      name: Today
      type: integer
    - jsonPath: .status.today.runMinutes
      name: Run
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Planned")].status
      name: Planned
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Schedule drives one writable bool capability from rules and an
          optional daily budget. It is run by the Oikade runtime.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Schedule
            properties:
              constraints:
                description: constraints limit how the budget is placed.
                properties:
                  maximumStartsPerDay:
                    description: maximumStartsPerDay limits starts per planning day.
                      Zero means unlimited. Live rules ignore it.
                    format: int32
                    minimum: 0
                    type: integer
                  minimumRest:
                    description: minimumRest is the shortest gap between runs.
                    type: string
                  minimumRun:
                    description: minimumRun is the shortest planned block, and the
                      shortest run after a live rule switches the target on.
                    type: string
                type: object
              minutes:
                description: minutes is the daily budget. Without it, the target is
                  on exactly in required slots.
                properties:
                  bands:
                    description: bands picks the budget from an input capability.
                    properties:
                      input:
                        description: input is the capability whose value picks the
                          band.
                        properties:
                          capability:
                            description: capability is the canonical capability, e.g.
                              switch.on.
                            minLength: 1
                            type: string
                          device:
                            description: device names a Device in the same namespace.
                            minLength: 1
                            type: string
                          maxAge:
                            default: 30m
                            description: maxAge is how old the value may be. Older
                              values count as missing.
                            type: string
                        required:
                        - capability
                        - device
                        type: object
                      missingMinutes:
                        description: missingMinutes is the budget when the input is
                          missing or older than maxAge.
                        format: int32
                        maximum: 1440
                        minimum: 0
                        type: integer
                      ranges:
                        description: ranges must ascend by below, and only the last
                          omits below.
                        items:
                          description: MinutesBand maps input values below a threshold
                            to a daily budget. The last band has no threshold.
                          properties:
                            below:
                              anyOf:
                              - type: integer
                              - type: string
                              description: below is the exclusive upper bound of input
                                values in this band, e.g. "12" or "-2.5".
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            minutes:
                              description: minutes is the daily budget for this band.
                              format: int32
                              maximum: 1440
                              minimum: 0
                              type: integer
                          required:
                          - minutes
                          type: object
                        maxItems: 16
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: atomic
                    required:
                    - input
                    - missingMinutes
                    - ranges
                    type: object
                  expression:
                    description: expression is CEL over devices, now and tz, returning
                      minutes as an int.
                    maxLength: 4096
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of bands or expression must be set
                  rule: has(self.bands) != has(self.expression)
              override:
                default: {}
                description: override sets how manual changes to the target are held.
                properties:
                  duration:
                    default: 2h
                    description: duration is how long a manual change, or turning
                      automatic off, holds the target.
                    type: string
                type: object
              planningTime:
                default: "00:00"
                description: planningTime starts each planning day, in the runtime's
                  --timezone.
                maxLength: 5
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                type: string
              rules:
                description: rules decide which slots are required, forbidden or preferred.
                  Precedence is require > forbid > prefer.
                items:
                  description: ScheduleRule shapes when the target runs. Exactly one
                    of require, forbid or prefer is set.
                  properties:
                    forbid:
                      description: forbid keeps the budget out of the matching slots.
                        Require rules still win.
                      type: boolean
                    live:
                      description: |-
                        live re-evaluates the rule whenever an input changes, instead of once at planningTime.
                        Only require rules can be live.
                      type: boolean
                    name:
                      description: name identifies the rule in status, logs and metrics.
                      pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                      type: string
                    prefer:
                      description: prefer weights the matching slots for the budget.
                        Negative values avoid them.
                      format: int32
                      maximum: 100
                      minimum: -100
                      type: integer
                    require:
                      description: require turns the target on in the matching slots.
                      type: boolean
                    when:
                      description: |-
                        when is a CEL condition, ANDed with the window. Planning rules see devices, now, tz and slot
                        (start, end, hour, minute and weekday, 0 = Sunday). Live rules see devices, now and tz.
                      maxLength: 4096
                      minLength: 1
                      type: string
                    window:
                      description: window limits the rule to a time of day. Omitted
                        means the whole day.
                      properties:
                        days:
                          description: days limits the window to these weekdays. Empty
                            means every day.
                          items:
                            description: Weekday is a day of the week.
                            enum:
                            - Mon
                            - Tue
                            - Wed
                            - Thu
                            - Fri
                            - Sat
                            - Sun
                            type: string
                          maxItems: 7
                          type: array
                          x-kubernetes-list-type: set
                        end:
                          description: end is the minute after the window ends.
                          maxLength: 5
                          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                        start:
                          description: start is the first minute of the window.
                          maxLength: 5
                          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                      required:
                      - end
                      - start
                      type: object
                      x-kubernetes-validations:
                      - message: start and end must differ; omit window for the whole
                          day
                        rule: self.start != self.end
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of require, forbid or prefer must be set
                    rule: '[has(self.require) && self.require, has(self.forbid) &&
                      self.forbid, has(self.prefer)].filter(x, x).size() == 1'
                  - message: live rules must set require and when
                    rule: '!(has(self.live) && self.live) || (has(self.require) &&
                      self.require && has(self.when))'
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              slotMinutes:
                default: 30
                description: slotMinutes divides the day into slots. Windows and durations
                  must be multiples of it.
                enum:
                - 15
                - 30
                - 60
                format: int32
                type: integer
              target:
                description: target is the capability the schedule drives, e.g. switch.on.
                properties:
                  capability:
                    description: capability is the canonical capability, e.g. switch.on.
                    minLength: 1
                    type: string
                  device:
                    description: device names a Device in the same namespace.
                    minLength: 1
                    type: string
                required:
                - capability
                - device
                type: object
            required:
            - target
            type: object
          status:
            description: status defines the observed state of Schedule
            properties:
              conditions:
                description: 'conditions: Ready (manager) and Planned (runtime).'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the generation the Ready condition
                  was computed for.
                format: int64
                type: integer
              today:
                description: today is the frozen plan for the current planning day.
                  It is written by the runtime.
                properties:
                  blocks:
                    description: blocks are today's planned runs.
                    items:
                      description: ScheduleBlock is one planned run of the target.
                      properties:
                        end:
                          description: end is when the target switches off.
                          format: date-time
                          type: string
                        start:
                          description: start is when the target switches on.
                          format: date-time
                          type: string
                      required:
                      - end
                      - start
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  date:
                    description: date is the planning day, YYYY-MM-DD, local time.
                    type: string
                  runMinutes:
                    description: runMinutes is the credited runtime so far, checkpointed
                      at most every 5 minutes.
                    format: int32
                    type: integer
                  scheduledMinutes:
                    description: scheduledMinutes is the total length of today's blocks.
                    format: int32
                    type: integer
                  shortfallMinutes:
                    description: shortfallMinutes is how much of the budget the constraints
                      left unplaced.
                    format: int32
                    type: integer
                  starts:
                    description: starts counts on commands sent today.
                    format: int32
                    type: integer
                  targetMinutes:
                    description: targetMinutes is today's budget.
                    format: int32
                    type: integer
                  targetSource:
                    description: targetSource is Bands, Missing, Expression or None.
                    enum:
                    - Bands
                    - Missing
                    - Expression
                    - None
                    type: string
                required:
                - date
                - runMinutes
                - scheduledMinutes
                - shortfallMinutes
                - starts
                - targetMinutes
                - targetSource
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
