---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: devices.home.oikade.dev
spec:
  group: home.oikade.dev
  names:
    kind: Device
    listKind: DeviceList
    plural: devices
    singular: device
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Name
      type: string
    - jsonPath: .spec.roomRef.name
      name: Room
      type: string
    - jsonPath: .status.capabilities[*].name
      name: Capabilities
      type: string
    - jsonPath: .status.conditions[?(@.type=="Available")].status
      name: Available
      type: string
    - jsonPath: .status.lastSeen
      name: Last Seen
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Device is a device declared in Git. Its spec is desired state;
          its status is written by the runtime.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Device
            properties:
              control:
                description: |-
                  control lists the capabilities that are arbitrated. Capabilities without an entry keep
                  last-write-wins.
                items:
                  description: |-
                    CapabilityControl makes one capability arbitrated (OIK-64): rules, HomeKit and the device itself
                    make claims on it, and the device takes the winner.
                  properties:
                    capability:
                      description: capability is the writable capability to arbitrate,
                        e.g. switch.on.
                      minLength: 1
                      type: string
                    default:
                      description: 'default is the value when nobody claims the capability:
                        a bool or number matching its kind.'
                      x-kubernetes-preserve-unknown-fields: true
                    external:
                      description: |-
                        external says what a change from outside the rules, through HomeKit or on the device
                        itself, does. Override makes it a claim for overrideHold; Revert writes the winner back.
                      enum:
                      - Override
                      - Revert
                      type: string
                    maximumOn:
                      description: maximumOn stops the device after it has been on
                        this long. It then rests for minimumOff.
                      type: string
                    maximumStartsPerDay:
                      description: maximumStartsPerDay limits how often the device
                        turns on per local day. Unset is unlimited.
                      format: int32
                      minimum: 1
                      type: integer
                    minimumOff:
                      description: minimumOff keeps the device off at least this long
                        once it stops.
                      type: string
                    minimumOn:
                      description: |-
                        minimumOn keeps the device on at least this long once it starts. Equipment limits win over
                        every claim, Safety included.
                      type: string
                    overrideHold:
                      description: |-
                        overrideHold is how long an outside change holds as an Override claim: a duration such as
                        1h, or Next to hold until the result without it next changes.
                      maxLength: 32
                      pattern: ^(Next|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                      type: string
                    resolve:
                      description: |-
                        resolve picks between claims at the same level: PreferOn or PreferOff for a bool capability,
                        Highest or Lowest for a number.
                      enum:
                      - PreferOn
                      - PreferOff
                      - Highest
                      - Lowest
                      type: string
                  required:
                  - capability
                  - default
                  - external
                  - resolve
                  type: object
                  x-kubernetes-validations:
                  - message: overrideHold is required when external is Override
                    rule: self.external != 'Override' || has(self.overrideHold)
                  - message: overrideHold has no effect when external is Revert
                    rule: self.external != 'Revert' || !has(self.overrideHold)
                  - message: overrideHold must be positive
                    rule: '!has(self.overrideHold) || self.overrideHold == ''Next''
                      || duration(self.overrideHold) > duration(''0s'')'
                  - message: minimumOn must not be negative
                    rule: '!has(self.minimumOn) || duration(self.minimumOn) >= duration(''0s'')'
                  - message: maximumOn must be positive
                    rule: '!has(self.maximumOn) || duration(self.maximumOn) > duration(''0s'')'
                  - message: minimumOff must not be negative
                    rule: '!has(self.minimumOff) || duration(self.minimumOff) >= duration(''0s'')'
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - capability
                x-kubernetes-list-type: map
              displayName:
                description: displayName is the human-friendly name shown in HomeKit
                  and Grafana. Defaults to the object name.
                maxLength: 64
                type: string
              homekit:
                description: homekit tunes how the device appears in HomeKit.
                properties:
                  service:
                    description: |-
                      service overrides the default service chosen from the device's capabilities,
                      e.g. Outlet for a smart plug that reports itself as a switch.
                    enum:
                    - Lightbulb
                    - Switch
                    - Outlet
                    - MotionSensor
                    - OccupancySensor
                    type: string
                type: object
              matter:
                description: matter tunes how the device appears on a Matter bridge.
                properties:
                  deviceType:
                    description: |-
                      deviceType overrides the device type chosen from the device's capabilities, e.g.
                      PlugInUnit for a smart plug that reports itself as a switch.
                    enum:
                    - Light
                    - PlugInUnit
                    - MountedControl
                    type: string
                required:
                - deviceType
                type: object
              plugin:
                description: plugin sources the device from a Plugin.
                properties:
                  id:
                    description: id is the device's stable, plugin-local identifier,
                      such as an eWeLink device ID. It appears in MQTT topics.
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$
                    type: string
                  parameters:
                    additionalProperties:
                      type: string
                    description: |-
                      parameters are plugin-specific settings. Oikade passes them through unchanged, and the plugin validates them.
                      Keys are up to 63 characters of letters, digits, '_', '.' and '-'; values are up to 1024 characters.
                    maxProperties: 32
                    type: object
                    x-kubernetes-validations:
                    - message: parameter keys must be 1-63 characters of letters,
                        digits, '_', '.' or '-'
                      rule: self.all(k, k.matches('^[A-Za-z0-9_.-]{1,63}$'))
                    - message: parameter values must be at most 1024 characters
                      rule: self.all(k, size(self[k]) <= 1024)
                  pluginRef:
                    description: pluginRef names the Plugin that serves the device.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                    x-kubernetes-validations:
                    - message: pluginRef.name is required
                      rule: self.name != ''
                required:
                - id
                - pluginRef
                type: object
              roomRef:
                description: roomRef names the Room the device is in.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              zigbee2mqtt:
                description: zigbee2mqtt sources the device from a Zigbee2MQTT instance.
                properties:
                  ieeeAddress:
                    description: |-
                      ieeeAddress is the device's IEEE address. It is used instead of the friendly name
                      because it never changes; the operator sets the friendly name to the Device's name.
                    pattern: ^0x[0-9a-f]{16}$
                    type: string
                  instanceRef:
                    description: instanceRef names the Zigbee2MQTT object the device
                      is paired with.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - ieeeAddress
                - instanceRef
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one driver source (zigbee2mqtt or plugin) is required
              rule: '[has(self.zigbee2mqtt), has(self.plugin)].filter(x, x).size()
                == 1'
          status:
            description: status defines the observed state of Device
            properties:
              capabilities:
                description: capabilities the driver reported for the device.
                items:
                  description: DeviceCapability is one capability a driver reported
                    for the device.
                  properties:
                    kind:
                      description: kind is the capability's value type.
                      enum:
                      - Bool
                      - Number
                      type: string
                    name:
                      description: name is the canonical capability, e.g. light.on
                        or sensor.temperature.
                      type: string
                    writable:
                      description: writable is true when the capability can be set,
                        e.g. light.on but not sensor.temperature.
                      type: boolean
                  required:
                  - kind
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                description: 'conditions: Ready, set by the operator, and Resolved
                  and Available, set by the runtime.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              control:
                description: control is the state of each arbitrated capability, written
                  by the runtime.
                items:
                  description: |-
                    CapabilityControlStatus is the state of one arbitrated capability. It changes at transitions,
                    not on every value.
                  properties:
                    capability:
                      description: capability is the arbitrated capability.
                      type: string
                    claims:
                      description: claims are the current claims, the winner among
                        them.
                      items:
                        description: ControlClaim is one source's claim on an arbitrated
                          capability.
                        properties:
                          expires:
                            description: expires is when the claim ends, if it ends
                              at a time.
                            format: date-time
                            type: string
                          latched:
                            description: latched is true for a latched hold, which
                              lasts until a release action.
                            type: boolean
                          level:
                            description: level is the claim's level.
                            enum:
                            - Safety
                            - Override
                            - Normal
                            - Default
                            type: string
                          reverted:
                            description: reverted is true for an outside change that
                              was written back.
                            type: boolean
                          source:
                            description: 'source is the path the claim came in by:
                              HomeKit, Device or Rule/<name>.'
                            type: string
                          value:
                            description: value is the claimed value.
                            x-kubernetes-preserve-unknown-fields: true
                          winner:
                            description: winner is true for the claim the device takes.
                            type: boolean
                        required:
                        - level
                        - source
                        - value
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    level:
                      description: level is the winning claim's level.
                      enum:
                      - Safety
                      - Override
                      - Normal
                      - Default
                      type: string
                    value:
                      description: value is the value the device was last given.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - capability
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - capability
                x-kubernetes-list-type: map
              lastSeen:
                description: lastSeen is when the driver last heard from the device
                  (updated at most every few minutes).
                format: date-time
                type: string
              manufacturer:
                description: manufacturer as reported by the device.
                type: string
              model:
                description: model as reported by the device.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
