---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: automations.home.oikade.dev
spec:
  group: home.oikade.dev
  names:
    kind: Automation
    listKind: AutomationList
    plural: automations
    singular: automation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastTriggered
      name: Last Triggered
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Automation is a rule run by the Oikade runtime.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Automation
            properties:
              actions:
                description: actions run in order.
                items:
                  description: Action is one step of an Automation. Exactly one field
                    must be set.
                  properties:
                    delay:
                      description: delay waits before the next action, e.g. 5m.
                      type: string
                    set:
                      description: set sets a capability on a device.
                      properties:
                        capability:
                          description: capability is the writable capability to set,
                            e.g. light.level.
                          minLength: 1
                          type: string
                        device:
                          description: device names a Device in the same namespace.
                          minLength: 1
                          type: string
                        room:
                          description: |-
                            room names a Room in the same namespace. Every discovered Device in it that reports the capability is set,
                            in name order.
                          minLength: 1
                          type: string
                        value:
                          description: value is a bool or number matching the capability's
                            kind.
                          x-kubernetes-preserve-unknown-fields: true
                      required:
                      - capability
                      - value
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of device or room must be specified
                        rule: has(self.device) != has(self.room)
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of set or delay must be specified
                    rule: has(self.set) != has(self.delay)
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              condition:
                description: |-
                  condition is a CEL expression that must evaluate to true for the actions to run.
                  Variables: devices (map of device name to map of capability to value),
                  trigger (device, capability, value, previous), now (timestamp) and tz (the runtime's
                  timezone). Timestamp accessors default to UTC, so pass tz for local time.
                  For example: trigger.value && (now.getHours(tz) >= 18 || now.getHours(tz) < 7)
                maxLength: 4096
                type: string
              mode:
                default: Single
                description: mode decides what happens when a trigger fires while
                  a run is in progress.
                enum:
                - Single
                - Restart
                type: string
              triggers:
                description: triggers are the capability changes that start the Automation.
                items:
                  description: Trigger fires the Automation when a capability of a
                    device, or of any device in a room, changes value.
                  properties:
                    capability:
                      description: capability is the canonical capability to watch,
                        e.g. sensor.occupancy-detected.
                      minLength: 1
                      type: string
                    device:
                      description: device names a Device in the same namespace.
                      minLength: 1
                      type: string
                    room:
                      description: |-
                        room names a Room in the same namespace. The trigger matches a change from any Device whose
                        roomRef is this room at the time of the change.
                      minLength: 1
                      type: string
                  required:
                  - capability
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of device or room must be specified
                    rule: has(self.device) != has(self.room)
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
            required:
            - actions
            - triggers
            type: object
          status:
            description: status defines the observed state of Automation
            properties:
              conditions:
                description: 'conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastTriggered:
                description: lastTriggered is when the actions last started (updated
                  at most every minute).
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the generation the Ready condition
                  was computed for.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
