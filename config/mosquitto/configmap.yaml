apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto
  namespace: system
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/managed-by: kustomize
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    # Retained messages (device lists, last state) survive broker restarts.
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
