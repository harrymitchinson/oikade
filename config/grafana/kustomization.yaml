# Provisions the "Oikade home" dashboard through the Grafana dashboard sidecar
# (kube-prometheus-stack watches ConfigMaps labelled grafana_dashboard: "1").
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
- name: grafana-dashboard
  namespace: system
  files:
  - oikade-home.json
