# The Oikade runtime follows the MQTT bus, writes Device status, exports metrics
# and runs Automations. It runs the operator's image; make deploy sets it here too.
resources:
- service_account.yaml
- role.yaml
- role_binding.yaml
- deployment.yaml
- service.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
- name: controller
  newName: example.com/oikade
  newTag: v0.0.1
