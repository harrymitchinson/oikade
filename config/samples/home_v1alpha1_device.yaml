# Pair a device (via the Zigbee2MQTT frontend), then declare it here by IEEE
# address. Until it's declared it shows up in oikade_undeclared_devices.
apiVersion: home.oikade.dev/v1alpha1
kind: Device
metadata:
  name: hallway-light
spec:
  displayName: Hallway Light
  roomRef: {name: hallway}
  zigbee2mqtt:
    instanceRef: {name: z2m}
    ieeeAddress: "0x000b57fffe000001"
  # light.on is arbitrated: rules, HomeKit and the wall switch make claims, and
  # the light takes the winner. A wall switch or Home app change holds until
  # what the rules want next changes.
  control:
  - capability: light.on
    default: false
    resolve: PreferOn
    external: Override
    overrideHold: Next
---
apiVersion: home.oikade.dev/v1alpha1
kind: Device
metadata:
  name: hallway-motion
spec:
  displayName: Hallway Motion
  roomRef: {name: hallway}
  zigbee2mqtt:
    instanceRef: {name: z2m}
    ieeeAddress: "0x00158d0000000002"
---
apiVersion: home.oikade.dev/v1alpha1
kind: Device
metadata:
  name: front-door
spec:
  displayName: Front Door
  roomRef: {name: hallway}
  zigbee2mqtt:
    instanceRef: {name: z2m}
    ieeeAddress: "0x00158d0000000003"
---
# A device served by a Plugin. id is plugin-local and stable; parameters are
# passed to the plugin unchanged.
apiVersion: home.oikade.dev/v1alpha1
kind: Device
metadata:
  name: porch-light
spec:
  displayName: Porch Light
  roomRef: {name: hallway}
  plugin:
    pluginRef: {name: example-switch}
    id: porch-light-1
    parameters:
      capability: light.on
---
# A heated towel rail on a plugin relay, arbitrated so a Home app tap holds until the morning
# window next starts or ends.
apiVersion: home.oikade.dev/v1alpha1
kind: Device
metadata:
  name: towel-rail
spec:
  displayName: Towel Rail
  plugin:
    pluginRef: {name: example-switch}
    id: towel-rail-1
    parameters:
      capability: switch.on
  control:
  - capability: switch.on
    default: false
    resolve: PreferOn
    external: Override
    overrideHold: Next
---
# The workshop heater is on unless a rule says otherwise. An outside change is written straight
# back, and it rests at least 10 minutes between runs.
apiVersion: home.oikade.dev/v1alpha1
kind: Device
metadata:
  name: workshop-heater
spec:
  displayName: Workshop Heater
  zigbee2mqtt:
    instanceRef: {name: z2m}
    ieeeAddress: "0x000b57fffe000004"
  control:
  - capability: switch.on
    default: true
    resolve: PreferOff
    external: Revert
    minimumOff: 10m
---
apiVersion: home.oikade.dev/v1alpha1
kind: Device
metadata:
  name: workshop-temperature
spec:
  displayName: Workshop Temperature
  zigbee2mqtt:
    instanceRef: {name: z2m}
    ieeeAddress: "0x00158d0000000005"
---
apiVersion: home.oikade.dev/v1alpha1
kind: Device
metadata:
  name: workshop-door
spec:
  displayName: Workshop Door
  zigbee2mqtt:
    instanceRef: {name: z2m}
    ieeeAddress: "0x00158d0000000006"
