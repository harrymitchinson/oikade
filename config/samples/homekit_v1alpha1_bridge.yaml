# Change the setup code before applying. HomeKit rejects trivial codes such as
# 111-11-111 and 123-45-678.
apiVersion: v1
kind: Secret
metadata:
  name: homekit-pin
stringData:
  pin: "031-45-154"
---
apiVersion: homekit.oikade.dev/v1alpha1
kind: Bridge
metadata:
  name: main
spec:
  displayName: Oikade
  pinSecretRef: {name: homekit-pin, key: pin}
  # Expose every Device in the namespace. Narrow it with matchLabels if needed.
  deviceSelector: {}
