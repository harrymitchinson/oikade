# Hallway light on with motion after dark, off five minutes after the last motion.
# Restart mode starts the five minutes again on every new motion event.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: hallway-motion-light
spec:
  mode: Restart
  triggers:
  - change: {device: hallway-motion, capability: occupancy}
  condition: trigger.value && (now.getHours(tz) >= 18 || now.getHours(tz) < 7)
  do:
  - set: {device: hallway-light, capability: current-level, value: 40}
  - set: {device: hallway-light, capability: on-off, value: true}
  - delay: 5m
  - set: {device: hallway-light, capability: on-off, value: false}
---
# Everything that switches in the living room off when the front door is shut after 23:00.
# A room action covers lamps added to the living room later without editing this.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: goodnight-living-room
spec:
  triggers:
  - change: {device: front-door, capability: contact}
  condition: "trigger.value && now.getHours(tz) >= 23"
  do:
  - set: {room: living-room, capability: on-off, value: false}
---
# The porch light on 15 minutes before sunset. If the runtime is down at that time, it still
# comes on up to 10 minutes late. Sun triggers need the runtime's --latitude and --longitude.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: porch-light-sunset
spec:
  triggers:
  - sun: {event: Sunset, offset: -15m}
  startingDeadline: 10m
  do:
  - set: {device: porch-light, capability: on-off, value: true}
---
# A towel-rail boost on Sunday evenings. The rail is arbitrated, so the set is a claim and must
# end: after an hour, or sooner if what the other rules want changes first.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: towel-rail-boost
spec:
  triggers:
  - at: {time: "19:00", days: [Sun]}
  do:
  - set: {device: towel-rail, capability: on-off, value: true, for: 1h, until: Next}
---
# The towel rail on from 06:00 to 08:00 on weekdays. Times are quoted: YAML reads a bare 06:00
# as a number.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: towel-rail-mornings
spec:
  while:
    window: {start: "06:00", end: "08:00", days: [Mon, Tue, Wed, Thu, Fri]}
  hold: {device: towel-rail, capability: on-off, value: true}
---
# The workshop heater off if the workshop gets too hot, and kept off until someone opens the
# door to check. Latched, so it acts even if the runtime was down when it overheated, and Safety,
# so no other rule or a Home app tap turns it back on.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: workshop-overheat
spec:
  priority: Safety
  while:
    when: devices["workshop-temperature"]["temperature"] > 45
    latch: true
  hold: {device: workshop-heater, capability: on-off, value: false}
---
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: workshop-overheat-reset
spec:
  triggers:
  - change: {device: workshop-door, capability: contact}
  condition: "!trigger.value"
  do:
  - release: {rule: workshop-overheat}
---
# The cellar dehumidifier runs for a daily budget that depends on the cellar's humidity at
# midnight: 1 to 6 hours, or 3 if the sensor hasn't reported in the last hour. The runtime
# places the hours in cheap night slots where it can, never during the evening.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: cellar-drying
spec:
  while:
    budget:
      planningTime: "00:00"
      slotMinutes: 30
      minutes:
        bands:
          input: {device: cellar-humidity, capability: relative-humidity, maxAge: 1h}
          missingMinutes: 180
          ranges:
          - {below: 55, minutes: 60}
          - {below: 65, minutes: 180}
          - {minutes: 360}
      prefer:
      - {window: {start: "23:00", end: "07:00"}, score: 3}
      - {window: {start: "12:00", end: "15:00", days: [Sat, Sun]}, score: 1}
      forbid:
      - {window: {start: "18:00", end: "22:00"}}
  hold: {device: cellar-dehumidifier, capability: on-off, value: true}
