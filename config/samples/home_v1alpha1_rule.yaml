# Hallway light on with motion after dark, off five minutes after the last motion.
# Restart mode starts the five minutes again on every new motion event.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: hallway-motion-light
spec:
  mode: Restart
  triggers:
  - change: {device: hallway-motion, capability: sensor.occupancy-detected}
  condition: trigger.value && (now.getHours(tz) >= 18 || now.getHours(tz) < 7)
  do:
  - set: {device: hallway-light, capability: light.level, value: 40}
  - set: {device: hallway-light, capability: light.on, value: true}
  - delay: 5m
  - set: {device: hallway-light, capability: light.on, value: false}
---
# Every light in the living room off when the front door is shut after 23:00.
# A room action covers lamps added to the living room later without editing this.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: goodnight-living-room
spec:
  triggers:
  - change: {device: front-door, capability: sensor.contact-open}
  condition: "!trigger.value && now.getHours(tz) >= 23"
  do:
  - set: {room: living-room, capability: light.on, value: false}
---
# The porch light on 15 minutes before sunset. If the runtime is down at that time, it still
# comes on up to 10 minutes late. Sun triggers need the runtime's --latitude and --longitude.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: porch-light-sunset
spec:
  triggers:
  - sun: {event: Sunset, offset: -15m}
  startingDeadline: 10m
  do:
  - set: {device: porch-light, capability: light.on, value: true}
---
# A towel-rail boost on Sunday evenings. The rail is arbitrated, so the set is a claim and must
# end: after an hour, or sooner if what the other rules want changes first.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: towel-rail-boost
spec:
  triggers:
  - at: {time: "19:00", days: [Sun]}
  do:
  - set: {device: towel-rail, capability: switch.on, value: true, for: 1h, until: Next}
---
# The towel rail on from 06:00 to 08:00 on weekdays. Times are quoted: YAML reads a bare 06:00
# as a number.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: towel-rail-mornings
spec:
  while:
    window: {start: "06:00", end: "08:00", days: [Mon, Tue, Wed, Thu, Fri]}
  hold: {device: towel-rail, capability: switch.on, value: true}
---
# The workshop heater off if the workshop gets too hot, and kept off until someone opens the
# door to check. Latched, so it acts even if the runtime was down when it overheated, and Safety,
# so no other rule or a Home app tap turns it back on.
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: workshop-overheat
spec:
  priority: Safety
  while:
    when: devices["workshop-temperature"]["sensor.temperature"] > 45
    latch: true
  hold: {device: workshop-heater, capability: switch.on, value: false}
---
apiVersion: home.oikade.dev/v1alpha1
kind: Rule
metadata:
  name: workshop-overheat-reset
spec:
  triggers:
  - change: {device: workshop-door, capability: sensor.contact-open}
  condition: trigger.value
  do:
  - release: {rule: workshop-overheat}
