# A network coordinator (e.g. SLZB-06) lets the pod run on any node. For a USB
# stick use port: /dev/ttyUSB0 and pin the pod with nodeSelector.
apiVersion: zigbee.oikade.dev/v1alpha1
kind: Zigbee2MQTT
metadata:
  name: z2m
spec:
  serial:
    port: tcp://slzb-06.lan:6638
    adapter: zstack
  # The web UI helps while pairing: kubectl port-forward svc/z2m 8080
  frontend: true
