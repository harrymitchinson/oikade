# A plugin is an out-of-process driver that speaks the oikade/v1 MQTT contract
# (docs/plugin-contract.md). Devices reference it from spec.plugin.
apiVersion: plugins.oikade.dev/v1alpha1
kind: Plugin
metadata:
  name: example-switch
spec:
  image: ghcr.io/harrymitchinson/oikade-plugin-example-switch:v0.1.0
  # Set hostNetwork: true for plugins that need mDNS or multicast, and
  # secretRef: {name: ...} for per-device credentials (one key per device id).
