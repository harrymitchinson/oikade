# A Matter bridge. The controller generates its setup passcode and discriminator, and puts the
# pairing code in the main-matter Secret:
#   kubectl get secret main-matter -o jsonpath='{.data.manual-code}' | base64 -d
apiVersion: matter.oikade.dev/v1alpha1
kind: Bridge
metadata:
  name: main
spec:
  displayName: Oikade
  # Expose every Device in the namespace. Narrow it with matchLabels if needed.
  deviceSelector: {}
