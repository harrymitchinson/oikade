name: Lint

on:
  pull_request:
  # Main isn't tested on every merge: hack/plan merge only merges a PR whose
  # checks passed on top of main. Nightly catches anything that slips past,
  # such as two PRs that pass alone but not together, and release.yml calls
  # this before it publishes a release.
  schedule:
    - cron: "0 3 * * *"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/changes.yml

  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: bin-lint-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod', '.custom-gcl.yml') }}

      - name: Cache lint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml', '.custom-gcl.yml') }}
          restore-keys: golangci-${{ runner.os }}-

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
