name: Lint

on:
  pull_request:
  # Main is tested on every merge too: hack/plan merge merges a PR behind main
  # when main hasn't touched its files, so two PRs can pass alone but not
  # together. A failure on main is fixed forward in a new PR. Nightly runs it
  # again, and release.yml calls this before it publishes a release.
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/changes.yml

  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: bin-lint-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}

      - name: Cache lint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: golangci-${{ runner.os }}-

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  # Not behind changes: hack/ is the planning scripts, which changes.yml counts
  # as docs and planning, and this job is quick.
  hack:
    permissions:
      contents: read
    name: Check the hack scripts
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run shellcheck and the hack tests
        run: make test-hack
