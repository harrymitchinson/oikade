name: Review gate

# A PR the user labelled needs-review waits for their Approve (docs/planning.md).
# hack/plan pr copies a feature's needs-review label onto each of its PRs.
# hack/plan merge merges a held PR only once main's hack/owner-approval says
# the user's Approve covers its head, as this check does. Agents open
# PRs as oikade-agent[bot], so the user can approve them. "Approved by the
# owner" is a required check on main, and it fails until they do. Any other PR
# passes, so hack/plan merge merges it once its checks pass.
#
# GitHub runs this from the PR's own branch, so a PR could change it. That
# doesn't open the gate: hack/plan merge reads the user's Approve itself, with
# main's hack/owner-approval, before it merges a held PR. Agents can't merge
# any other way, since gh pr merge and gh api are denied to them.
#
# A review doesn't start a run of its own: review-gate-rerun.yml reruns this
# one, so the head commit only ever has one "Approved by the owner" result.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions: {}

# One run at a time per PR, in order, so an older run can't finish last.
concurrency:
  group: review-gate-${{ github.event.pull_request.number }}

jobs:
  gate:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    name: Approved by the owner
    runs-on: ubuntu-latest
    steps:
      # Credentials stay, read-only, so the check can fetch an approved
      # commit that a restack left on no branch.
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check for the owner's Approve on a needs-review PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          MAIN: ${{ github.event.repository.default_branch }}
        # Everything is read now, not from the event, since a rerun after a
        # review carries the event from before it.
        run: |
          set -euo pipefail
          pr=$(gh pr view "$PR" --json labels,body,author,headRefOid,baseRefName)
          head=$(jq -r .headRefOid <<<"$pr")
          base=$(jq -r .baseRefName <<<"$pr")

          held=""
          if jq -e '[.labels[].name] | index("needs-review")' <<<"$pr" >/dev/null; then held="#$PR is labelled needs-review"; fi
          if [ -z "$held" ]; then
            echo "#$PR needs no Approve here: it isn't labelled needs-review"
            exit 0
          fi

          # GitHub won't let an author approve their own PR. The owner opened
          # this one, so they've seen it.
          if [ "$(jq -r .author.login <<<"$pr")" = "$OWNER" ]; then
            echo "::notice::$held, but @$OWNER opened it, and GitHub won't let them approve it"
            exit 0
          fi

          # hack/owner-approval decides, as it does for hack/plan merge: the
          # owner's latest decisive review must approve this code, at the head
          # or before a restack. It exits 2 when it can't tell, which fails too.
          # Main's copy runs, not the PR's, which the PR could change. Only
          # the PR that adds it to main has none there to run.
          if git cat-file -e "origin/$MAIN:hack/owner-approval" 2>/dev/null; then
            git show "origin/$MAIN:hack/owner-approval" >"$RUNNER_TEMP/owner-approval"
          else
            echo "::notice::$MAIN has no hack/owner-approval yet, so this PR's own copy decides"
            cp hack/owner-approval "$RUNNER_TEMP/owner-approval"
          fi
          if why=$(OWNER="$OWNER" bash "$RUNNER_TEMP/owner-approval" "$PR" "$head" "$base"); then
            echo "$why"
            exit 0
          fi
          echo "::error::$held. $why"
          exit 1
