name: Review gate

# A PR labelled needs-review, or one for a feature labelled needs-review,
# waits for the user's Approve (docs/design/0108-agent-identity.md). Agents open
# PRs as oikade-agent[bot], so the user can approve them. "Approved by the
# owner" is a required check on main, and it fails until they do. Any other PR
# passes, so hack/plan merge still merges low-risk steps.
#
# GitHub runs this from the PR's own branch, so a PR could change it. One
# that does touches .github/, which hack/plan treats as protected: it's always
# needs-review, and the user reads that change before approving it. Agents
# can't merge, since they have no gh write but hack/plan, which refuses.
#
# A review doesn't start a run of its own: review-gate-rerun.yml reruns this
# one, so the head commit only ever has one "Approved by the owner" result.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions: {}

# One run at a time per PR, in order, so an older run can't finish last.
concurrency:
  group: review-gate-${{ github.event.pull_request.number }}

jobs:
  gate:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    name: Approved by the owner
    runs-on: ubuntu-latest
    steps:
      # Credentials stay, read-only, so the check can fetch an approved
      # commit that a restack left on no branch. It runs the PR's own
      # hack/owner-approval, as it runs the PR's own copy of this file: a PR
      # that changes either touches a protected path and waits for the owner.
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check for the owner's Approve on a needs-review PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
        # Everything is read now, not from the event, since a rerun after a
        # review carries the event from before it.
        run: |
          set -euo pipefail
          pr=$(gh pr view "$PR" --json labels,body,author,headRefOid,baseRefName)
          head=$(jq -r .headRefOid <<<"$pr")
          base=$(jq -r .baseRefName <<<"$pr")

          held=""
          if jq -e '[.labels[].name] | index("needs-review")' <<<"$pr" >/dev/null; then held="#$PR is labelled needs-review"; fi
          feature=$(jq -r '.body' <<<"$pr" | sed -nE 's/^(Part of|Closes) #([0-9]+).*/\2/p' | head -1)
          if [ -z "$held" ] && [ -n "$feature" ] &&
            gh issue view "$feature" --json labels -q '.labels[].name' | grep -qx needs-review; then
            held="its feature #$feature is labelled needs-review"
          fi
          if [ -z "$held" ]; then
            echo "#$PR needs no Approve here: neither it nor its feature is labelled needs-review"
            exit 0
          fi

          # GitHub won't let an author approve their own PR. The owner opened
          # this one, so they've seen it.
          if [ "$(jq -r .author.login <<<"$pr")" = "$OWNER" ]; then
            echo "::notice::$held, but @$OWNER opened it, and GitHub won't let them approve it"
            exit 0
          fi

          # hack/owner-approval decides, as it does for hack/plan merge: the
          # owner's latest decisive review must approve this code, at the head
          # or before a restack. It exits 2 when it can't tell, which fails too.
          if why=$(OWNER="$OWNER" hack/owner-approval "$PR" "$head" "$base"); then
            echo "$why"
            exit 0
          fi
          echo "::error::$held. $why"
          exit 1
