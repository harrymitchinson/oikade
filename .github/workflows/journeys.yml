name: Journeys

on:
  # The journeys take minutes, so PRs don't wait for them: on a PR only the image build runs. Main
  # runs them after each merge, skipping changes that can't change a host. Run them on a branch by
  # hand (workflow_dispatch), or locally with make test-journeys.
  pull_request:
    paths:
      - "contract/**"
      - "cmd/**"
      - "framework/**"
      - "internal/**"
      - "plugins/**"
      - "test/**"
      - "sdk/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - ".github/workflows/journeys.yml"
  push:
    branches: [main]
    paths:
      - "contract/**"
      - "cmd/**"
      - "framework/**"
      - "internal/**"
      - "plugins/**"
      - "test/**"
      - "sdk/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - ".github/workflows/journeys.yml"
  # Nightly, and release.yml calls this before it publishes a release
  schedule:
    - cron: "0 3 * * *"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  journeys:
    permissions:
      contents: read
    name: Run on Ubuntu
    if: github.event_name != 'pull_request'
    # arm64, because the chip-tool the journeys drive is published for linux/arm64 only.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Building the chip-tool image pulls connectedhomeip's 6 GB image, so the 35 MB result is
      # cached until its Dockerfile changes.
      - name: Cache the chip-tool image
        id: chip-tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/chip-tool.tar
          key: chip-tool-${{ runner.arch }}-${{ hashFiles('test/journeys/chip-tool/Dockerfile') }}

      - name: Load or build the chip-tool image
        env:
          TARBALL: ${{ runner.temp }}/chip-tool.tar
          CACHED: ${{ steps.chip-tool.outputs.cache-hit }}
        run: |
          if [ "$CACHED" = true ]; then
            docker load -i "$TARBALL"
          else
            make chip-tool-image
            docker save -o "$TARBALL" $(docker images --filter 'reference=oikade-chip-tool:*' --format '{{.Repository}}:{{.Tag}}')
          fi

      - name: Run the journeys
        run: make test-journeys

  # The journeys build the binary outside Docker, so this checks that the Dockerfile, which releases
  # build, still builds.
  docker-build:
    permissions:
      contents: read
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build the image from the Dockerfile
        run: make docker-build IMG=oikade:ci
