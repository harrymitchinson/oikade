name: E2E Tests

on:
  pull_request:
    # Kind e2e takes ~8 minutes; skip it for PRs that cannot change cluster behaviour
    paths:
      - "api/**"
      - "contract/**"
      - "cmd/**"
      - "internal/**"
      - "config/**"
      - "test/**"
      - "sdk/**"
      - "plugins/**"
      - "hack/boilerplate.go.txt"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - ".github/workflows/test-e2e.yml"
  # Main isn't tested on every merge (see test.yml): nightly, and release.yml
  # calls this before it publishes a release
  schedule:
    - cron: "0 3 * * *"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # setup-go's cache key is shared with every workflow, so whichever job saves
          # first wins and the e2e build is never saved. This job keeps its own.
          cache: false

      # Keyed on go.sum only, so each dependency change saves one entry rather than
      # every commit adding a multi-GB one. The dependencies are most of the build.
      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-e2e-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-e2e-${{ runner.os }}-

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e E2E_IMAGE_BUILD=docker-build-prebuilt
          make cleanup-test-e2e

  # e2e builds the manager outside Docker, so this checks that the root Dockerfile,
  # which releases build, still builds. It runs beside e2e, not before it.
  docker-build:
    permissions:
      contents: read
    name: Build the manager image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build the manager image from the Dockerfile
        run: make docker-build IMG=oikade:ci
