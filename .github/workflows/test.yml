name: Tests

on:
  pull_request:
  # Main is tested on every merge too: hack/plan merge merges a PR behind main
  # when main hasn't touched its files, so two PRs can pass alone but not
  # together. A failure on main is fixed forward in a new PR. Nightly runs it
  # again, and release.yml calls this before it publishes a release.
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/changes.yml

  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Runs a cross-compiled arm64 home's check mode (test/host). A slow
      # Ubuntu mirror once hung this for 44 minutes (OIK-300), so each try gets
      # three minutes, and a third failure fails the job.
      - name: Install the arm64 emulator
        timeout-minutes: 10
        run: |
          for try in 1 2 3; do
            if sudo timeout 3m sh -c 'apt-get update && apt-get install -y -o DPkg::Lock::Timeout=60 qemu-user-static'; then
              exit 0
            fi
            echo "Could not install qemu-user-static, try $try of 3"
          done
          exit 1

      # Fails instead of tidying, so an untidy go.mod can't hide behind CI.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Running Tests
        env:
          OIKADE_REQUIRE_EMULATOR: "1"
        run: make test

  race:
    permissions:
      contents: read
    name: Race detector
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run the tests under the race detector
        run: make test-race

  plugins:
    permissions:
      contents: read
    name: Plugin SDK and conformance
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run the conformance suite against the simswitch fixture
        run: make test-conformance

      # Plugins run on arm64 Pis from static distroless images, so the SDK must build that way.
      - name: Build the simswitch fixture static for linux/arm64 and linux/amd64
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o /dev/null ./test/fixtures/simswitch
          done
