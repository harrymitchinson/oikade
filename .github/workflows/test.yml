name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/changes.yml

  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: bin-test-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}

      - name: Running Tests
        run: |
          go mod tidy
          make test

  plugins:
    permissions:
      contents: read
    name: Plugin SDK and conformance
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run the conformance suite against example-switch
        run: make test-conformance

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the example-switch image for arm64 and amd64
        run: make docker-buildx-plugin PLUGIN=example-switch
