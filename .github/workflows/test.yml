name: Tests

on:
  pull_request:
  # Main isn't tested on every merge: hack/plan merge only merges a PR whose
  # checks passed on top of main. Nightly catches anything that slips past,
  # such as two PRs that pass alone but not together, and release.yml calls
  # this before it publishes a release.
  schedule:
    - cron: "0 3 * * *"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/changes.yml

  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Runs a cross-compiled arm64 home's check mode (test/host).
      - name: Install the arm64 emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      # Fails instead of tidying, so an untidy go.mod can't hide behind CI.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Running Tests
        env:
          OIKADE_REQUIRE_EMULATOR: "1"
        run: make test

  race:
    permissions:
      contents: read
    name: Race detector
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run the tests under the race detector
        run: make test-race

  plugins:
    permissions:
      contents: read
    name: Plugin SDK and conformance
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run the conformance suite against the simswitch fixture
        run: make test-conformance

      # Plugins run on arm64 Pis from static distroless images, so the SDK must build that way.
      - name: Build the simswitch fixture static for linux/arm64 and linux/amd64
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o /dev/null ./test/fixtures/simswitch
          done
