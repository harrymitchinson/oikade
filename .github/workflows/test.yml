name: Tests

on:
  pull_request:
  # Main is tested on every merge too: hack/plan merge merges a PR behind main
  # when main hasn't touched its files, so two PRs can pass alone but not
  # together. A failure on main is fixed forward in a new PR. Nightly runs it
  # again, and release.yml calls this before it publishes a release.
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_call:
  workflow_dispatch:

permissions: {}

# Each job keeps its own Go cache, the modules and the build cache, because
# each builds differently (coverage, the race detector). Only main's runs save
# one, under a new key each run, so a PR restores what main built last rather
# than whatever was first saved for its go.sum.
env:
  GO_CACHE_PATHS: |
    ~/go/pkg/mod
    ~/.cache/go-build

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/changes.yml

  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Name the Go cache
        id: cache
        run: echo "prefix=go-$RUNNER_OS-$(go env GOVERSION)-$GITHUB_JOB-${{ hashFiles('go.sum') }}" >>"$GITHUB_OUTPUT"

      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: ${{ steps.cache.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache.outputs.prefix }}-

      # Fails instead of tidying, so an untidy go.mod can't hide behind CI.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Running Tests
        run: make test

      - name: Save the Go cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: ${{ steps.cache.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}

  # A cross-compiled arm64 home's check mode runs under qemu-user here, in a job
  # of its own, so the emulator's install isn't on the test job's way.
  arm64:
    permissions:
      contents: read
    name: Cross-compiled check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Name the Go cache
        id: cache
        run: echo "prefix=go-$RUNNER_OS-$(go env GOVERSION)-$GITHUB_JOB-${{ hashFiles('go.sum') }}" >>"$GITHUB_OUTPUT"

      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: ${{ steps.cache.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache.outputs.prefix }}-

      # A slow Ubuntu mirror once hung this for 44 minutes, so each try gets
      # three minutes, and a third failure fails the job.
      - name: Install the arm64 emulator
        timeout-minutes: 10
        run: |
          for try in 1 2 3; do
            if sudo timeout 3m sh -c 'apt-get update && apt-get install -y -o DPkg::Lock::Timeout=60 qemu-user'; then
              exit 0
            fi
            echo "Could not install qemu-user, try $try of 3"
          done
          exit 1

      - name: Run the arm64 home's check
        env:
          OIKADE_REQUIRE_EMULATOR: "1"
        run: go test -count=1 -run '^TestCrossCompiledBuildRunsItsCheck$' -v ./test/host

      - name: Save the Go cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: ${{ steps.cache.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}

  race:
    permissions:
      contents: read
    name: Race detector
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Name the Go cache
        id: cache
        run: echo "prefix=go-$RUNNER_OS-$(go env GOVERSION)-$GITHUB_JOB-${{ hashFiles('go.sum') }}" >>"$GITHUB_OUTPUT"

      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: ${{ steps.cache.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache.outputs.prefix }}-

      - name: Run the tests under the race detector
        run: make test-race

      - name: Save the Go cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: ${{ steps.cache.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}

  # test/host and test/cli with the race detector in every binary they start:
  # the host, its home, plugins and the CLI. It takes about ten minutes, so it
  # runs nightly, and on a branch by hand (workflow_dispatch), not on each PR.
  race-binaries:
    permissions:
      contents: read
    name: Race detector in the binaries
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Name the Go cache
        id: cache
        run: echo "prefix=go-$RUNNER_OS-$(go env GOVERSION)-$GITHUB_JOB-${{ hashFiles('go.sum') }}" >>"$GITHUB_OUTPUT"

      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: ${{ steps.cache.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache.outputs.prefix }}-

      - name: Run test/host and test/cli under the race detector
        run: make test-race-binaries

      - name: Save the Go cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: ${{ steps.cache.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}

  plugins:
    permissions:
      contents: read
    name: Plugin SDK and conformance
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Name the Go cache
        id: cache
        run: echo "prefix=go-$RUNNER_OS-$(go env GOVERSION)-$GITHUB_JOB-${{ hashFiles('go.sum') }}" >>"$GITHUB_OUTPUT"

      - name: Restore the Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: ${{ steps.cache.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache.outputs.prefix }}-

      - name: Run the conformance suite against the simswitch fixture
        run: make test-conformance

      # A plugin runs on an arm64 or amd64 host with cgo off, built into a home or on its own, so
      # the SDK must build that way for both.
      - name: Build the simswitch fixture static for linux/arm64 and linux/amd64
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o /dev/null ./test/fixtures/simswitch
          done

      - name: Save the Go cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: ${{ steps.cache.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
