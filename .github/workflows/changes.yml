name: Changes

# Docs and planning changes can't break Go, so Tests and Lint skip their jobs
# for PRs that touch nothing else. Skipped jobs still report, so hack/plan
# merge sees the checks.
on:
  workflow_call:
    outputs:
      code:
        description: '"true" unless the PR changes only docs and planning files'
        value: ${{ jobs.changes.outputs.code }}

permissions: {}

jobs:
  changes:
    permissions:
      contents: read
    name: Check for code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: List changed files that aren't docs or planning
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo code=true >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR's merge commit, and HEAD^1 the base it merges into.
          # --no-renames lists both sides, so moving code into docs/ counts.
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          # contract/v1's tests check docs/plugin-contract.md, so it counts as code
          code=$(grep -vE '\.md$|^docs/|^\.claude/|^hack/plan$|^LICENSE$' <<<"$files"; grep -Fx docs/plugin-contract.md <<<"$files" || true)
          echo "$code"
          if [ -n "$code" ]; then echo code=true; else echo code=false; fi >>"$GITHUB_OUTPUT"
